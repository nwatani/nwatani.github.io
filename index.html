   (12px cells + 3px gap = 15px — v3 assumed 14px, which drifted a pixel per
   column and ~50px across the year), and hugged to the physical left so
   Arabic lines up with the columns instead of mirroring away from them.
   The app's own row is retired with a !important rule rather than edited.
   Prefer the labels underneath? swap the insertBefore target to
   `grid.nextSibling` — everything else stays the same.
   1 · month labels were positioned in % against a row that stretches to
       100% of the card, so they slid left of their columns on wide screens;
   2 · insetInlineStart flips in RTL, so Arabic mirrored the label row;
   3 · labels came from the first cell of a week that fell in a new month,
       so boundary weeks were labelled up to 6 days late.
   v2 fixed v1's own bug — labels were left static, so `left` was ignored and
   they ran together as "SeptNovDecJan…".
   v3 fixes the Arabic-specific defects:
     a · month names came out one month early west of UTC, because a bare
         `new Date(...T00:00:00Z)` formats in local time → timeZone:"UTC";
     b · Arabic month names are ~1.6× wider than "Jan", so neighbouring
         labels overlapped → real widths are measured and overlaps dropped;
     c · React re-applies this row's inline style (width + min-width:100%)
         when its subtree re-renders, which undid the width fix and could
         re-show the app's own labels → widths now use !important, and the
         app's labels are hidden by an injected stylesheet rule, not by an
         inline style React can clobber.
   Strategy: leave React's nodes alone — read the real counts/dates out of
   the existing tooltips, recolour the cells from those numbers, hide the
   old labels, and append pixel-accurate ones. Loop-guarded.               */
(function () {
  var GAP = 3;
  var LEVELS = [
    "rgba(148,163,184,.08)",
    "color-mix(in srgb, var(--color-accent) 22%, transparent)",
    "color-mix(in srgb, var(--color-accent) 45%, transparent)",
    "color-mix(in srgb, var(--color-accent) 72%, transparent)",
    "var(--color-accent)"
  ];
  var sig = "";

  /* an injected stylesheet beats any inline style React re-applies on render */
  function ensureCss() {
    if (document.getElementById("heatfix-css")) return;
    var s = document.createElement("style");
    s.id = "heatfix-css";
    s.textContent =
      ".heatfix-hide{display:none !important}" +
      "#heatfix-months{position:relative;height:16px;margin:0 0 5px;font-size:10px;line-height:16px;" +
      "direction:ltr;text-align:left;color:color-mix(in srgb, currentColor 72%, transparent)}" +
      "#heatfix-months>span{position:absolute;top:0;white-space:nowrap}";
    (document.head || document.documentElement).appendChild(s);
  }

  function locale() {
    return document.documentElement.getAttribute("data-lang") === "ar"
      ? "ar-EG-u-nu-latn" : "en-GB";
  }
  function levelOf(n) { return n <= 0 ? 0 : n < 2 ? 1 : n < 4 ? 2 : n < 7 ? 3 : 4; }

  function readCell(cell) {
    var title = cell.getAttribute("title") || "";
    var dm = title.match(/(\d{4}-\d{2}-\d{2})/);
    var count = 0;
    if (dm) {
      var rest = title.replace(dm[1], " ");
      var nm = rest.match(/\d+/);
      count = nm ? Number(nm[0]) : 0;
    }
    return { date: dm ? dm[1] : null, count: count };
  }

  function apply() {
    var cells = Array.prototype.slice.call(document.querySelectorAll(".heat-cell"));
    if (!cells.length) return;

    var firstColumn = cells[0].parentElement;
    var grid        = firstColumn && firstColumn.parentElement;
    if (!grid) return;
    var appMonths = grid.nextElementSibling;
    var parent    = grid.parentElement;

    var cols    = Array.prototype.slice.call(grid.children);
    var haveRow = !!document.getElementById("heatfix-months");
    var hidden  = !!(appMonths && appMonths.className.indexOf("heatfix-hide") !== -1);
    var next = cols.length + "|" + (cells[0].getAttribute("title") || "") + "|" +
               locale() + "|" + (document.documentElement.getAttribute("data-accent") || "") +
               "|" + haveRow + "|" + hidden;
    if (next === sig) return;
    sig = next;

    ensureCss();

    /* 1 · GitHub's graph reads left → right in every language, with localised
           month names. Force it, whatever the page direction happens to be. */
    grid.setAttribute("dir", "ltr");
    grid.style.setProperty("direction", "ltr", "important");

    /* 2 · retire the app's own month row: it is positioned in percentages of a
           full-width row and anchors itself from the right in Arabic, which is
           what left every label under the wrong column. */
    if (appMonths && appMonths.children && appMonths.children.length &&
        !appMonths.classList.contains("heatfix-hide") &&
        appMonths.id !== "heatfix-months") {
      appMonths.classList.add("heatfix-hide");
    }

    /* 3 · the real column pitch, measured — never assume 14px (12px cells plus
           a 3px gap) or the labels drift a pixel per week, ~50px a year. */
    var a = cols[0].getBoundingClientRect();
    var b = cols[1] && cols[1].getBoundingClientRect();
    var pitch = b ? Math.round(b.left - a.left) : 0;
    if (!pitch || pitch < 8) pitch = Math.round(a.width) + GAP;

    /* 4 · counts → colour, so the shade always matches the tooltip number */
    var days = [];
    cols.forEach(function (col, i) {
      Array.prototype.forEach.call(col.children, function (cell) {
        var d = readCell(cell);
        if (!d.date) return;
        days.push({ date: d.date, count: d.count, col: i });
        cell.style.background = LEVELS[levelOf(d.count)];
      });
    });

    /* 5 · a fresh month row, directly ABOVE the grid, pinned to the grid's own
           width and hugged to the physical left so Arabic aligns too */
    var old = document.getElementById("heatfix-months");
    if (old && old.parentNode) old.parentNode.removeChild(old);

    var row = document.createElement("div");
    row.id = "heatfix-months";
    row.setAttribute("dir", "ltr");
    row.style.width = (cols.length * pitch - GAP) + "px";
    row.style.marginLeft = "0";
    row.style.marginRight = "auto";
    parent.insertBefore(row, grid);          /* use grid.nextSibling for below */

    /* 6 · a label on the column that holds day 1 of each month.
           timeZone:"UTC" — without it a date at 00:00Z formats as the previous
           day locally, so west of UTC every month name came out a month early. */
    var fmt = new Intl.DateTimeFormat(locale(), { month: "short", timeZone: "UTC" });
    var seen = {}, added = [], firstCol = days[0] && days[0].col;

    days.forEach(function (d) {
      var day = new Date(d.date + "T00:00:00Z");
      if (d.col !== firstCol && day.getUTCDate() !== 1) return;
      var key = day.getUTCFullYear() + "-" + day.getUTCMonth();
      if (seen[key]) return;
      seen[key] = 1;
      var span = document.createElement("span");
      span.textContent = fmt.format(day);
      span.style.left = (d.col * pitch) + "px";
      row.appendChild(span);
      added.push(span);
    });

    /* 7 · Arabic month names are far wider than "Sept": measure what actually
           rendered and drop a label that would touch its neighbour. */
    var prevRight = -1e9;
    added.forEach(function (span) {
      var r = span.getBoundingClientRect();
      if (r.left < prevRight + 3) {
        if (span.remove) span.remove(); else span.parentNode.removeChild(span);
        return;
      }
      prevRight = r.right;
    });
  }

  var timer;
  function schedule() { clearTimeout(timer); timer = setTimeout(apply, 60); }

  function boot() {
    apply();
    new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
    new MutationObserver(schedule).observe(document.documentElement, {
      attributes: true, attributeFilter: ["data-lang", "data-accent"]
    });
    window.addEventListener("resize", schedule);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<script>
/* ── project-card links · v2 ───────────────────────────────────────────
   Every repo card gains a small, always-visible row of two choices:
   "Repository" and "Live demo" — so the visitor picks instead of being forced
   into whichever URL the card happens to carry.
   Why v2: a hover-only bar was invisible to anyone who did not hover exactly
   over the card, and it depended on api.github.com — so a rate-limited API
   meant no bar at all. Also, the user-site repo card (nwatani.github.io) used
   to be skipped; it now gets both buttons like every other card, its demo
   pointing at the site root. Now:
     · the row is always rendered (subtle, at the foot of the card);
     · the Repository URL is derived from the card's own link, so that button
       appears with zero API calls;
     · the Live demo button is added as soon as we know a demo is published
       (api.github.com `homepage`, or `has_pages`, or the card already pointing
       at github.io/<repo>/), so it is never a dead link;
     · buttons, not anchors: the card is already an <a> and nested anchors are
       invalid. Each calls preventDefault() so the card's link does not fire. */
(function () {
  var CACHE = "nwatani.repomap", TTL = 30 * 60 * 1000, NEW_TAB = true;
  var map = null, loading = false;

  function userName() {
    var m = location.hostname.match(/^([^.]+)\.github\.io$/i);
    if (m) return m[1];
    var a = document.querySelector('a[href^="https://github.com/"]');
    var seg = a && (a.getAttribute("href") || "").split("/")[3];
    return seg || "nwatani";
  }
  function isAr() { return document.documentElement.getAttribute("data-lang") === "ar"; }
  function labels() {
    return isAr()
      ? { repo: "المستودع ↗", demo: "تجربة مباشرة ↗" }
      : { repo: "Repository ↗", demo: "Live demo ↗" };
  }

  function ensureCss() {
    if (document.getElementById("repolinks-css")) return;
    var s = document.createElement("style");
    s.id = "repolinks-css";
    s.textContent =
      /* always present, pinned to the foot of the card — never hover-only */
      ".repolinks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;" +
      "margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}" +
      ".repolinks button{cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:700;" +
      "padding:7px 11px;border-radius:9px;white-space:nowrap;line-height:1.2;" +
      "border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#cfe0f2;" +
      "transition:background-color .15s ease,border-color .15s ease,color .15s ease}" +
      ".repolinks button:hover{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.13)}" +
      ".repolinks button.demo{border-color:color-mix(in srgb,var(--color-accent) 45%,transparent);" +
      "background:color-mix(in srgb,var(--color-accent) 13%,rgba(3,10,22,.9));" +
      "color:color-mix(in srgb,var(--color-accent) 92%,white)}" +
      ".repolinks button.demo:hover{background:color-mix(in srgb,var(--color-accent) 26%,rgba(3,10,22,.9))}" +
      ".repolinks button:focus-visible,.repolinks button:active{outline:2px solid color-mix(in srgb,var(--color-accent) 70%,transparent);outline-offset:2px}" +
      "@media (prefers-reduced-motion:reduce){.repolinks button{transition:none}}";
    (document.head || document.documentElement).appendChild(s);
  }

  /* one API call for the whole list, cached for 30 minutes */
  function loadMap(then) {
    if (map) { then(); return; }
    try {
      var raw = JSON.parse(sessionStorage.getItem(CACHE) || "null");
      if (raw && Date.now() - raw.at < TTL) { map = raw.data; then(); return; }
    } catch (e) {}
    if (loading) return;
    loading = true;
    fetch("https://api.github.com/users/" + userName() + "/repos?per_page=100&sort=pushed",
          { headers: { Accept: "application/vnd.github+json" } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) {
        var m = {};
        (Array.isArray(list) ? list : []).forEach(function (r) {
          m[r.name] = { homepage: (r.homepage || "").trim(), pages: !!r.has_pages };
        });
        map = m;
        try { sessionStorage.setItem(CACHE, JSON.stringify({ at: Date.now(), data: m })); } catch (e) {}
      })
      .catch(function () {
        map = {};                                  /* repo buttons only, for now */
        setTimeout(function () { map = null; loadMap(paint); }, 20000);   /* one retry */
      })
      .then(function () { loading = false; then(); });
  }

  function infoFor(a) {
    var u = userName(), href = a.getAttribute("href") || "";
    var asRepo  = href.match(new RegExp("^https://github\\.com/" + u + "/([^/?#]+)/?$", "i"));
    var asPages = href.match(new RegExp("^https://" + u + "\\.github\\.io/([^/?#]+)/?$", "i"));
    var asRoot  = new RegExp("^https://" + u + "\\.github\\.io/?$", "i").test(href);
    var name = asRoot ? u + ".github.io" : asRepo ? asRepo[1] : asPages ? asPages[1] : "";
    if (!name) return null;

    var meta = map && map[name];
    var demo = "";

    if (name === u + ".github.io") {
      /* the user site: its demo is this very site, its repo is the profile repo.
         v2 gives it both buttons like every other card, instead of skipping it. */
      demo = "https://" + u + ".github.io/";
    } else if (meta && meta.homepage) {
      demo = meta.homepage;
    } else if (meta && meta.pages) {
      demo = "https://" + u + ".github.io/" + name + "/";
    } else if (asPages) {
      demo = href;                                            /* the card already links a demo */
    }
    /* the repository link is always derivable from the card itself, so a card is
       never skipped: if the API is rate-limited the visitor still gets the repo
       button, and the demo button is added once the data arrives. */
    return { name: name, repo: "https://github.com/" + u + "/" + name, demo: demo };
  }

  function openUrl(url, ev) {
    ev.preventDefault(); ev.stopPropagation();
    if (NEW_TAB) window.open(url, "_blank", "noopener"); else location.href = url;
  }

  var timer, lastCount = -1;
  function schedule() { clearTimeout(timer); timer = setTimeout(paint, 80); }

  function paint() {
    var t = labels(), u = userName(), html = [];
    ensureCss();
    html = Array.prototype.filter.call(document.querySelectorAll("a.glass, a.glass-hover"), function (a) {
      return a.querySelector("p.font-mono");
    });

    html.forEach(function (a) {
      var info = infoFor(a);
      if (!info) return;
      /* signature includes the language *and* whether a demo is known, so the
         bar is rebuilt once the repo data lands */
      var sig = isAr() + "|" + (info.demo ? 1 : 0) + "|" + (a.querySelector(".repolinks") ? 1 : 0);
      if (a.dataset.repolinks === sig) return;

      var prev = a.querySelector(".repolinks");
      if (prev && prev.parentNode) prev.parentNode.removeChild(prev);

      var bar = document.createElement("div");
      bar.className = "repolinks";

      var bRepo = document.createElement("button");
      bRepo.type = "button"; bRepo.className = "repo"; bRepo.dir = "auto";
      bRepo.textContent = t.repo;
      bRepo.setAttribute("aria-label", t.repo + " — " + info.name);
      bRepo.addEventListener("click", function (e) { openUrl(info.repo, e); });
      bar.appendChild(bRepo);

      if (info.demo) {                    /* only when we know it is published */
        var bDemo = document.createElement("button");
        bDemo.type = "button"; bDemo.className = "demo"; bDemo.dir = "auto";
        bDemo.textContent = t.demo;
        bDemo.setAttribute("aria-label", t.demo + " — " + info.name);
        bDemo.addEventListener("click", function (e) { openUrl(info.demo, e); });
        bar.appendChild(bDemo);
      }

      a.appendChild(bar);
      a.classList.add("has-repolinks");
      a.dataset.repolinks = sig;         /* set after insertion: this node's own
                                            mutation must not re-trigger paint   */
    });

    /* a one-line console report, so the state is visible without guessing */
    try {
      var n = document.querySelectorAll(".repolinks").length;
      var demoCount = document.querySelectorAll(".repolinks button.demo").length;
      if (n !== lastCount) {
        lastCount = n;
        window.__cardlinks = { cards: n, withDemo: demoCount, repoListLoaded: !!map };
        console.info("[cardlinks] " + n + " card(s), " + demoCount + " with a live-demo button" +
          (map ? "" : " — repo list not loaded yet"));
      }
    } catch (e) {}
  }

  function boot() {
    paint();
    loadMap(paint);
    new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
    new MutationObserver(schedule).observe(document.documentElement, {
      attributes: true, attributeFilter: ["data-lang", "data-accent"]
    });
    window.addEventListener("resize", schedule);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</head>

    <div id="root"></div>
